# Render.com Blueprint — deploys the whole project as ONE web service.
# In the Render dashboard: New + → Blueprint → connect this repo,
# and Render reads this file automatically.
#
# One free-tier-friendly service: FastAPI serves both the React UI and the API.
# SQLite lives on the service's local disk — data resets on redeploys/restarts
# unless you attach a Render Disk (paid) or switch to an external database.

services:
  - type: web
    name: customer-intelligence
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true          # Render injects a secure random value
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_DIST
        value: /app/frontend/dist
      - key: ALLOWED_ORIGINS
        value: https://customer-intelligence.onrender.com
